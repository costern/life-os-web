<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life OS – Login</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a1d23; --muted:#6b7280; --line:#e5e7eb; --accent:#4f46e5; --red:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; width:320px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  input { width:100%; font-family:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; margin-bottom:12px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; font-family:inherit; font-size:14px; font-weight:600; background:var(--accent); color:#fff;
    border:none; border-radius:10px; padding:11px; cursor:pointer; }
  button:hover { opacity:.9; }
  button:disabled { background:#c7c9d1; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:16px; }
</style>
</head>
<body>
  <form class="box" id="loginForm">
    <h1>Life OS</h1>
    <p class="sub">Privates Dashboard – bitte anmelden</p>
    <input type="password" id="pw" placeholder="Passwort" autofocus>
    <button type="submit" id="btn">Anmelden</button>
    <div class="err" id="err"></div>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login fehlgeschlagen');
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
